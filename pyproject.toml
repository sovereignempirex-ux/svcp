[project]
name = "scvp"
version = "0.1.0a4"
description = "SCVP — a provider-agnostic Python runtime for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
local-models = [
    "torch>=2.0",
    "transformers>=4.35",
]
gguf = [
    "llama-cpp-python>=0.2.0",
]

[project.scripts]
scvp = "scvp.cli.main:cli"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scvp*"]

[tool.setuptools.package-data]
scvp = ["cli/templates/**/*"]
