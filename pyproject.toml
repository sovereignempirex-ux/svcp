[project]
name = "scvp"
version = "0.1.0a4"
description = "SCVP — a provider-agnostic Python runtime for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
[project.urls]
Homepage = "https://github.com/sovereignempirex-ux/svcp"
Repository = "https://github.com/sovereignempirex-ux/svcp"
Issues = "https://github.com/sovereignempirex-ux/svcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
local-models = [
    "torch>=2.0",
    "transformers>=4.35",
]
gguf = [
    "llama-cpp-python>=0.2.0",
]
embeddings = [
    "sentence-transformers>=3.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]
api-security = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
scvp = "scvp.cli.main:cli"

[project.entry-points."scvp.plugins"]
example = "scvp.plugins.example:plugin"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scvp*"]

[tool.setuptools.package-data]
scvp = ["cli/templates/**/*"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "unit: isolated provider or utility tests",
    "integration: tests spanning multiple SCVP layers",
    "security: authentication, authorization, and secret-handling tests",
]
