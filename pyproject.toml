[project]
name = "scvp"
version = "0.1.0a1"
description = "SCVP — Scalable Cognitive Virtual Platform: a provider-agnostic AI agent framework/SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
scvp = "scvp.cli.main:cli"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scvp*"]

[tool.setuptools.package-data]
scvp = ["cli/templates/**/*"]
